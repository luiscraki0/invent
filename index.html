<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario del taller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--bg:#eef1ec;--surf:#fff;--ink:#1b2a2b;--mute:#5d6b6a;--line:#cdd5cf;--tape:#f2b81b;--low:#c23b2a;--ok:#2f7d5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1b;--surf:#1b2626;--ink:#e8eeea;--mute:#9aa9a7;--line:#2e3c3d;--low:#ff7a66;--ok:#5fc596}}
:root[data-theme="dark"]{--bg:#121a1b;--surf:#1b2626;--ink:#e8eeea;--mute:#9aa9a7;--line:#2e3c3d;--low:#ff7a66;--ok:#5fc596}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
.tape{background:var(--tape);color:#1b2a2b;margin:0 -16px;padding:22px 16px 30px;position:relative}
.tape::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#1b2a2b 0 2px,transparent 2px 10px),repeating-linear-gradient(90deg,#1b2a2b 0 2px,transparent 2px 50px);background-size:100% 8px,100% 14px;background-repeat:repeat-x;background-position:0 100%}
.tape .in{max-width:828px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,6vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.tape p{margin:6px 0 0;font-weight:500}
.stats{display:flex;gap:28px;flex-wrap:wrap;padding:18px 0 6px}
.stats b{display:block;font-size:30px;line-height:1.1;font-weight:700}
.stats span{color:var(--mute);font-size:14px}
.stats .warn b{color:var(--low)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.bar input{flex:1 1 200px;width:auto}
button{cursor:pointer;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
button:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border-radius:99px;padding:5px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--tape);border-color:var(--tape);color:#1b2a2b;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.chk input{width:auto}
#panel{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--tape);border-radius:6px;padding:16px;margin:0 0 16px}
#panel[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--mute)}
label input,label select{margin-top:4px;color:var(--ink)}
.full{grid-column:1/-1}
.btns{display:flex;gap:8px;margin-top:14px}
#err{color:var(--low);font-size:14px;margin:10px 0 0;min-height:1em}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(90px,1fr) auto auto;gap:6px 16px;align-items:center;background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:6px;padding:12px 14px;margin-bottom:8px}
.row.low{border-left-color:var(--low)}
.nm strong{display:block;font-weight:600}
.nm small{color:var(--mute);font-size:13px}
.tag{color:var(--low);font-weight:600}
.gauge{position:relative;height:14px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px);border-bottom:2px solid var(--line)}
.gauge i{position:absolute;left:0;bottom:0;height:8px;background:var(--ok)}
.low .gauge i{background:var(--low)}
.gauge u{position:absolute;left:50%;top:0;bottom:-2px;width:2px;background:var(--ink);text-decoration:none}
.qty{display:flex;align-items:center;gap:8px;white-space:nowrap}
.qty button{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.qty span{min-width:64px;text-align:center;font-weight:600}
.act{display:flex;gap:6px}
.act button{font-size:13px;padding:6px 9px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:6px}
.empty p{margin:0 0 12px}
.legend{font-size:13px;color:var(--mute);margin:14px 0 0}
@media (max-width:640px){.row{grid-template-columns:1fr auto}.gauge{grid-column:1/-1;order:3}.qty{order:2}.act{grid-column:1/-1;order:4}}
</style>
</head>
<body>
<div class="tape"><div class="in">
<h1>Inventario del taller</h1>
<p>Materiales, herramientas y repuestos al día.</p>
</div></div>
<div class="wrap">
<div class="stats" id="stats"></div>
<div class="bar">
<input id="q" type="search" placeholder="Buscar artículo" aria-label="Buscar artículo">
<label class="chk"><input type="checkbox" id="low"> Solo por reponer</label>
<button class="primary" id="add">Agregar artículo</button>
</div>
<div class="chips" id="chips"></div>
<div id="panel" hidden>
<div class="grid">
<label class="full">Nombre<input id="f-name" placeholder="Ej.: Cable 12 AWG, hilo de bordar, silicona"></label>
<label>Categoría<select id="f-cat"></select></label>
<label>Cantidad<input id="f-qty" type="number" min="0" step="any" inputmode="decimal"></label>
<label>Unidad<input id="f-unit" placeholder="uds, m, kg, rollos"></label>
<label>Avisar al llegar a<input id="f-min" type="number" min="0" step="any" inputmode="decimal"></label>
<label>Costo por unidad ($)<input id="f-cost" type="number" min="0" step="any" inputmode="decimal"></label>
<label>Precio de venta ($)<input id="f-price" type="number" min="0" step="any" inputmode="decimal"></label>
</div>
<p id="err" role="alert"></p>
<div class="btns"><button class="primary" id="save">Guardar artículo</button><button id="cancel">Cancelar</button></div>
</div>
<ul id="list"></ul>
<p class="legend">La marca negra de la regla indica el punto de aviso. Los datos se guardan en este navegador.</p>
</div>
<script>
(function(){
var KEY='inventario-taller-v1',CATS=['Materiales','Herramientas','Repuestos','Productos terminados'];
var items=[],cat='Todos',q='',onlyLow=false,editId=null,delId=null;
function $(i){return document.getElementById(i)}
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function num(n){return Math.round(n*100)/100}
function seed(){
var d=[['Hilo de bordar',0,40,'madejas',10,0.5,1.2],['Silicona en barra',0,3,'barras',12,0.25,0.6],['Taladro inalámbrico',1,1,'uds',1,55,0],['Tornillos 6 x 1 pulg.',2,120,'uds',50,0.04,0.1],['Cable eléctrico 12 AWG',2,8,'m',15,0.9,1.8],['Velas decorativas',3,6,'uds',4,2.5,8]];
items=d.map(function(x,i){return{id:Date.now()+i,name:x[0],cat:CATS[x[1]],qty:x[2],unit:x[3],min:x[4],cost:x[5],price:x[6]}});save();render()}
function render(){
var tot=items.length,nl=items.filter(function(i){return i.qty<=i.min}).length;
var val=items.reduce(function(s,i){return s+i.qty*i.cost},0);
$('stats').innerHTML='<div><b>'+tot+'</b><span>artículos</span></div><div class="'+(nl?'warn':'')+'"><b>'+nl+'</b><span>por reponer</span></div><div><b>'+money(val)+'</b><span>valor en stock</span></div>';
$('chips').innerHTML=['Todos'].concat(CATS).map(function(c){return '<button data-cat="'+c+'" aria-pressed="'+(c===cat)+'">'+c+'</button>'}).join('');
var ql=q.trim().toLowerCase();
var v=items.filter(function(i){return (cat==='Todos'||i.cat===cat)&&(!onlyLow||i.qty<=i.min)&&(!ql||i.name.toLowerCase().indexOf(ql)>-1)});
if(!v.length){
$('list').innerHTML='<li class="empty">'+(items.length?'<p>No hay artículos con ese filtro.</p>':'<p>Todavía no hay artículos. Agrega el primero o carga ejemplos para ver cómo funciona.</p><button data-a="seed">Cargar ejemplos</button>')+'</li>';return}
$('list').innerHTML=v.map(function(i){
var low=i.qty<=i.min,pct=Math.max(0,Math.min(100,i.qty/Math.max(i.min*2,1)*100));
var meta=esc(i.cat)+', '+money(i.cost)+' c/u'+(i.price?', venta '+money(i.price):'');
return '<li class="row'+(low?' low':'')+'"><div class="nm"><strong>'+esc(i.name)+'</strong><small>'+meta+(low?' <span class="tag">Reponer</span>':'')+'</small></div>'
+'<div class="gauge" role="img" aria-label="Stock '+num(i.qty)+' de aviso '+num(i.min)+'"><i style="width:'+pct+'%"></i><u></u></div>'
+'<div class="qty"><button data-a="dec" data-id="'+i.id+'" aria-label="Restar uno">−</button><span>'+num(i.qty)+' '+esc(i.unit||'')+'</span><button data-a="inc" data-id="'+i.id+'" aria-label="Sumar uno">+</button></div>'
+'<div class="act"><button data-a="edit" data-id="'+i.id+'">Editar</button><button data-a="del" data-id="'+i.id+'">'+(delId===i.id?'¿Eliminar?':'Eliminar')+'</button></div></li>'}).join('')}
function openPanel(it){
editId=it?it.id:null;$('err').textContent='';
$('f-name').value=it?it.name:'';$('f-cat').value=it?it.cat:CATS[0];$('f-qty').value=it?it.qty:'';
$('f-unit').value=it?it.unit:'';$('f-min').value=it?it.min:'';$('f-cost').value=it?it.cost:'';$('f-price').value=it&&it.price?it.price:'';
$('panel').hidden=false;$('f-name').focus()}
function closePanel(){$('panel').hidden=true;editId=null}
function commit(){
var name=$('f-name').value.trim(),qty=parseFloat($('f-qty').value);
if(!name){$('err').textContent='Escribe el nombre del artículo.';return}
if(isNaN(qty)||qty<0){$('err').textContent='Escribe la cantidad que tienes ahora (0 o más).';return}
var o={name:name,cat:$('f-cat').value,qty:qty,unit:$('f-unit').value.trim(),min:parseFloat($('f-min').value)||0,cost:parseFloat($('f-cost').value)||0,price:parseFloat($('f-price').value)||0};
if(editId){items=items.map(function(i){return i.id===editId?Object.assign({},i,o):i})}else{o.id=Date.now();items.unshift(o)}
save();closePanel();render()}
$('f-cat').innerHTML=CATS.map(function(c){return '<option>'+c+'</option>'}).join('');
$('add').onclick=function(){openPanel(null)};$('cancel').onclick=closePanel;$('save').onclick=commit;
$('q').oninput=function(e){q=e.target.value;render()};
$('low').onchange=function(e){onlyLow=e.target.checked;render()};
$('chips').onclick=function(e){var b=e.target.closest('button');if(b){cat=b.getAttribute('data-cat');render()}};
$('list').onclick=function(e){
var b=e.target.closest('button');if(!b)return;
var a=b.getAttribute('data-a'),id=Number(b.getAttribute('data-id'));
if(a==='seed'){seed();return}
var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
if(a==='inc'){it.qty=num(it.qty+1)}
else if(a==='dec'){it.qty=Math.max(0,num(it.qty-1))}
else if(a==='edit'){openPanel(it);return}
else if(a==='del'){if(delId===id){items=items.filter(function(i){return i.id!==id});delId=null}else{delId=id;render();return}}
delId=null;save();render()};
load();render();
})();
</script>
</body>
</html>
